<template>
  <div class="oi-health-metadata">
    <template if:true={isLoading}>
      <c-oi-skeleton lines="6" label="Loading Metadata Health"></c-oi-skeleton>
    </template>

    <template if:true={hasError}>
      <c-oi-state-banner
        state="error"
        title="Couldn't load Metadata Health"
        message={loadError}
        onretry={handleRetry}
      ></c-oi-state-banner>
    </template>

    <template if:true={hasDetail}>
      <div class="oi-health-detail-header">
        <c-oi-health-score-ring
          score={detail.score}
          severity-key={detail.severityKey}
          size="lg"
        ></c-oi-health-score-ring>
        <div class="oi-health-detail-header-title">
          <div class="oi-health-eyebrow">Metadata Health</div>
          <h2>Object shape and connectivity across the org</h2>
        </div>
        <div class="oi-health-detail-coverage">
          <span class="oi-health-coverage-pill">{detail.coverageNote}</span>
          <span>{computedAtLabel}</span>
          <template if:true={canRunCompute}>
            <button
              type="button"
              class="oi-btn"
              onclick={handleSync}
              disabled={isSyncing}
            >
              {syncButtonLabel}
            </button>
          </template>
        </div>
      </div>

      <template if:true={syncError}>
        <c-oi-state-banner
          state="error"
          title="Couldn't sync Metadata Health findings"
          message={syncError}
          onretry={handleSync}
        ></c-oi-state-banner>
      </template>

      <c-oi-health-formula-disclosure
        summary={detail.formulaSummary}
        components={formulaComponents}
        is-open-by-default="true"
      ></c-oi-health-formula-disclosure>

      <div class="oi-health-detail-kpi-row">
        <template for:each={detail.kpiTiles} for:item="tile">
          <c-oi-health-kpi-tile
            key={tile.label}
            label={tile.label}
            value={tile.value}
            metric-key={tile.metricKey}
            onselect={handleKpiTileSelect}
          ></c-oi-health-kpi-tile>
        </template>
      </div>

      <div class="oi-health-detail-split">
        <c-oi-health-breakdown-list
          title={detail.breakdownTitle}
          coverage-caption={detail.breakdownCoverageCaption}
          metric-column-labels={detail.metricColumnLabels}
          rows={breakdownRows}
          clickable
          onrowselect={handleRowSelect}
        ></c-oi-health-breakdown-list>
        <c-oi-health-heatmap-grid
          title="Signal heatmap"
          column-labels={detail.heatmapColumnLabels}
          rows={heatmapRows}
        ></c-oi-health-heatmap-grid>
      </div>

      <c-oi-health-glossary
        title="What these terms mean"
        terms={glossaryTerms}
      ></c-oi-health-glossary>
    </template>

    <c-oi-health-finding-drawer
      if:true={hasSelectedFinding}
      finding={selectedFinding}
      onclose={handleDrawerClose}
      onsaved={handleDrawerSaved}
      onrelatedselect={handleDrawerRelatedSelect}
    ></c-oi-health-finding-drawer>

    <c-oi-health-live-insight-panel
      if:true={hasLiveInsightRow}
      row={liveInsightRow}
      metric-column-labels={detail.metricColumnLabels}
      section-label="Metadata Health"
      can-sync={canRunCompute}
      is-syncing={isSyncing}
      onclose={handleLiveInsightClose}
      onsync={handleLiveInsightSync}
    ></c-oi-health-live-insight-panel>

    <c-oi-health-kpi-drilldown-modal
      if:true={hasDrilldownModal}
      metric-key={selectedMetricKey}
      onclose={handleDrilldownClose}
      onrowselect={handleRowSelect}
    ></c-oi-health-kpi-drilldown-modal>
  </div>
</template>

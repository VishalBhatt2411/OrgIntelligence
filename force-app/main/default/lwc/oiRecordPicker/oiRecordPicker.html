<template>
  <div class="oi-combobox">
    <div class="oi-combobox-row">
      <lightning-input
        class="oi-combobox-input"
        type="search"
        label="Search records"
        variant="label-hidden"
        placeholder={placeholderText}
        value={queryTerm}
        onchange={handleInputChange}
        onfocus={handleFocus}
        onblur={handleBlur}
      ></lightning-input>
      <button
        type="button"
        data-id="search-button"
        class="oi-combobox-button"
        onclick={handleSearchButtonClick}
      >
        Search
      </button>
    </div>
    <template lwc:if={isSearching}>
      <div
        class="oi-combobox-panel oi-combobox-status"
        data-id="search-loading"
      >
        <lightning-spinner
          alternative-text="Searching"
          size="x-small"
        ></lightning-spinner>
      </div>
    </template>
    <template lwc:elseif={hasError}>
      <div
        class="oi-combobox-panel oi-combobox-status oi-combobox-error"
        data-id="search-error"
        role="alert"
      >
        {errorMessage}
      </div>
    </template>
    <template lwc:elseif={hasResults}>
      <ul
        class="oi-combobox-panel oi-combobox-results"
        data-id="search-results"
      >
        <template for:each={displayResults} for:item="result">
          <li key={result.recordId}>
            <button
              data-id="search-result-item"
              data-record-id={result.recordId}
              class="oi-combobox-option"
              onclick={handleResultClick}
            >
              <span
                class="oi-combobox-option-glyph oi-combobox-option-glyph_record"
                aria-hidden="true"
                >{result.initials}</span
              >
              <span class="oi-combobox-option-copy">
                <strong class="oi-combobox-option-label">{result.label}</strong>
                <span class="oi-combobox-option-secondary"
                  >{result.recordId}</span
                >
              </span>
              <span class="oi-combobox-option-meta">
                <span class="oi-combobox-option-type">{objectApiName}</span>
                <span class="oi-combobox-option-arrow" aria-hidden="true"
                  >→</span
                >
              </span>
            </button>
          </li>
        </template>
      </ul>
    </template>
  </div>
</template>

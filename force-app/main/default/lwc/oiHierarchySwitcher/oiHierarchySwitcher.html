<template>
  <div class="oi-hierarchy-switcher">
    <template lwc:if={isLoading}>
      <c-oi-skeleton
        data-id="switcher-loading"
        lines="1"
        label="Loading hierarchies"
      ></c-oi-skeleton>
    </template>
    <template lwc:elseif={hasError}>
      <c-oi-state-banner
        data-id="switcher-error"
        state="error"
        title="Couldn't load hierarchies"
        message={errorMessage}
        onretry={handleRetry}
      ></c-oi-state-banner>
    </template>
    <template lwc:elseif={showEmptyState}>
      <c-oi-state-banner
        data-id="switcher-empty"
        state="true-zero"
        title="No hierarchies for this object"
        message="The hierarchy list loaded successfully and none of the active hierarchies are scoped to this object."
      ></c-oi-state-banner>
    </template>
    <template lwc:else>
      <lightning-combobox
        data-id="switcher-combobox"
        label="Hierarchy"
        variant="label-hidden"
        value={selectedDefinitionId}
        options={comboboxOptions}
        onchange={handleChange}
      ></lightning-combobox>
    </template>
  </div>
</template>

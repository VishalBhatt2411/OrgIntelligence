<template>
  <div class="oi-hierarchy-manager">
    <div class="oi-hierarchy-manager-sidebar">
      <div class="oi-hierarchy-manager-sidebar-header">
        <h2 class="oi-hierarchy-manager-title">Hierarchies</h2>
        <button
          type="button"
          class="oi-btn"
          data-id="new-definition-button"
          onclick={handleNewDefinitionClick}
        >
          New
        </button>
      </div>
      <template lwc:if={isLoadingDefinitions}>
        <c-oi-skeleton
          data-id="definitions-loading"
          lines="4"
          label="Loading hierarchies"
        ></c-oi-skeleton>
      </template>
      <template lwc:elseif={hasDefinitionsError}>
        <c-oi-state-banner
          data-id="definitions-error"
          state="error"
          title="Couldn't load hierarchies"
          message={definitionsError}
          onretry={handleRetryDefinitions}
        ></c-oi-state-banner>
      </template>
      <template lwc:elseif={hasDefinitions}>
        <ul class="oi-hierarchy-manager-list" data-id="definitions-list">
          <template for:each={definitions} for:item="definition">
            <li key={definition.definitionId}>
              <button
                type="button"
                class="oi-hierarchy-manager-list-item"
                data-id="definition-row"
                data-definition-id={definition.definitionId}
                onclick={handleDefinitionRowClick}
              >
                <span class="oi-hierarchy-manager-list-item-name"
                  >{definition.name}</span
                >
                <span class="oi-hierarchy-manager-list-item-meta"
                  >{definition.objectApiName} · {definition.status}</span
                >
              </button>
            </li>
          </template>
        </ul>
      </template>
      <template lwc:else>
        <c-oi-state-banner
          data-id="definitions-empty"
          state="true-zero"
          title="No hierarchies yet"
          message="The hierarchy list loaded successfully and there are none. Choose New to define one."
        ></c-oi-state-banner>
      </template>
    </div>

    <div class="oi-hierarchy-manager-detail">
      <h3 class="oi-hierarchy-manager-section-title">{definitionFormTitle}</h3>
      <template lwc:if={hasDefinitionFormError}>
        <c-oi-state-banner
          data-id="definition-form-error"
          state="error"
          title="Couldn't save this hierarchy"
          message={definitionFormError}
          onretry={handleSaveDefinition}
        ></c-oi-state-banner>
      </template>
      <div class="oi-hierarchy-manager-form" data-id="definition-form">
        <lightning-input
          label="Name"
          data-field="name"
          data-id="definition-name-input"
          value={definitionDraft.name}
          onchange={handleDefinitionFieldChange}
        ></lightning-input>
        <lightning-textarea
          label="Description"
          data-field="description"
          value={definitionDraft.description}
          onchange={handleDefinitionFieldChange}
        ></lightning-textarea>
        <lightning-input
          label="Object API Name"
          data-field="objectApiName"
          data-id="definition-object-input"
          value={definitionDraft.objectApiName}
          onchange={handleDefinitionFieldChange}
        ></lightning-input>
        <lightning-combobox
          label="Status"
          data-field="status"
          value={definitionDraft.status}
          options={statusOptions}
          onchange={handleDefinitionFieldChange}
        ></lightning-combobox>
        <lightning-input
          type="number"
          label="Max Levels"
          data-field="maxLevels"
          value={definitionDraft.maxLevels}
          onchange={handleDefinitionFieldChange}
        ></lightning-input>
        <lightning-input
          label="Relationship Type"
          data-field="relationshipType"
          value={definitionDraft.relationshipType}
          onchange={handleDefinitionFieldChange}
        ></lightning-input>
        <lightning-input
          type="checkbox"
          label="Allow Multiple Parents"
          checked={definitionDraft.allowMultipleParents}
          onchange={handleAllowMultipleParentsChange}
        ></lightning-input>
        <lightning-input
          type="checkbox"
          label="Allow Multiple Hierarchies"
          checked={definitionDraft.allowMultipleHierarchies}
          onchange={handleAllowMultipleHierarchiesChange}
        ></lightning-input>
        <button
          type="button"
          class="oi-btn oi-btn_primary"
          data-id="save-definition-button"
          disabled={isSavingDefinition}
          onclick={handleSaveDefinition}
        >
          Save Hierarchy
        </button>
      </div>

      <template lwc:if={showLevelsSection}>
        <div class="oi-hierarchy-manager-levels">
          <div class="oi-hierarchy-manager-sidebar-header">
            <h3 class="oi-hierarchy-manager-section-title">Levels</h3>
            <button
              type="button"
              class="oi-btn"
              data-id="add-level-button"
              onclick={handleAddLevelClick}
            >
              Add Level
            </button>
          </div>
          <template lwc:if={isLoadingLevels}>
            <c-oi-skeleton
              data-id="levels-loading"
              lines="3"
              label="Loading hierarchy levels"
            ></c-oi-skeleton>
          </template>
          <template lwc:elseif={hasLevelsError}>
            <c-oi-state-banner
              data-id="levels-error"
              state="error"
              title="Couldn't load hierarchy levels"
              message={levelsError}
              onretry={handleRetryLevels}
            ></c-oi-state-banner>
          </template>
          <template lwc:elseif={hasLevels}>
            <table class="oi-hierarchy-manager-table" data-id="levels-table">
              <thead>
                <tr>
                  <th>Level</th>
                  <th>Name</th>
                  <th>Object</th>
                  <th>Required</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                <template for:each={levelRows} for:item="level">
                  <tr key={level.levelId}>
                    <td>{level.levelNumber}</td>
                    <td>{level.levelName}</td>
                    <td>{level.objectApiName}</td>
                    <td>{level.requiredLabel}</td>
                    <td class="oi-hierarchy-manager-row-actions">
                      <button
                        type="button"
                        class="oi-btn oi-btn_link"
                        data-id="edit-level-button"
                        data-level-id={level.levelId}
                        onclick={handleEditLevelClick}
                      >
                        Edit
                      </button>
                      <button
                        type="button"
                        class="oi-btn oi-btn_link"
                        data-id="delete-level-button"
                        data-level-id={level.levelId}
                        onclick={handleDeleteLevel}
                      >
                        Delete
                      </button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </template>
          <template lwc:else>
            <c-oi-state-banner
              data-id="levels-empty"
              state="true-zero"
              title="No levels defined yet"
              message="This hierarchy's levels loaded successfully and there are none. Add one to describe the hierarchy's depth."
            ></c-oi-state-banner>
          </template>

          <template lwc:if={levelDraft}>
            <div class="oi-hierarchy-manager-form" data-id="level-form">
              <template lwc:if={hasLevelFormError}>
                <c-oi-state-banner
                  data-id="level-form-error"
                  state="error"
                  title="Couldn't save this level"
                  message={levelFormError}
                  onretry={handleSaveLevel}
                ></c-oi-state-banner>
              </template>
              <lightning-input
                label="Level Name"
                data-field="levelName"
                data-id="level-name-input"
                value={levelDraft.levelName}
                onchange={handleLevelFieldChange}
              ></lightning-input>
              <lightning-input
                type="number"
                label="Level Number"
                data-field="levelNumber"
                value={levelDraft.levelNumber}
                onchange={handleLevelFieldChange}
              ></lightning-input>
              <lightning-input
                label="Object API Name"
                data-field="objectApiName"
                value={levelDraft.objectApiName}
                onchange={handleLevelFieldChange}
              ></lightning-input>
              <lightning-input
                label="Relationship Field API Name"
                data-field="relationshipFieldApiName"
                value={levelDraft.relationshipFieldApiName}
                onchange={handleLevelFieldChange}
              ></lightning-input>
              <lightning-input
                type="checkbox"
                label="Required"
                checked={levelDraft.isRequired}
                onchange={handleLevelRequiredChange}
              ></lightning-input>
              <div class="oi-hierarchy-manager-form-actions">
                <button
                  type="button"
                  class="oi-btn oi-btn_primary"
                  data-id="save-level-button"
                  disabled={isSavingLevel}
                  onclick={handleSaveLevel}
                >
                  Save Level
                </button>
                <button
                  type="button"
                  class="oi-btn"
                  data-id="cancel-level-button"
                  onclick={handleCancelLevelForm}
                >
                  Cancel
                </button>
              </div>
            </div>
          </template>
        </div>
      </template>

      <template lwc:if={showRelationshipsSection}>
        <div class="oi-hierarchy-manager-relationships">
          <div class="oi-hierarchy-manager-sidebar-header">
            <h3 class="oi-hierarchy-manager-section-title">Relationships</h3>
            <button
              type="button"
              class="oi-btn"
              data-id="add-relationship-button"
              onclick={handleNewRelationshipClick}
            >
              Assign Relationship
            </button>
          </div>
          <template lwc:if={isLoadingRelationships}>
            <c-oi-skeleton
              data-id="relationships-loading"
              lines="4"
              label="Loading hierarchy relationships"
            ></c-oi-skeleton>
          </template>
          <template lwc:elseif={hasRelationshipsError}>
            <c-oi-state-banner
              data-id="relationships-error"
              state="error"
              title="Couldn't load hierarchy relationships"
              message={relationshipsError}
              onretry={handleRetryRelationships}
            ></c-oi-state-banner>
          </template>
          <template lwc:elseif={hasRelationships}>
            <table
              class="oi-hierarchy-manager-table"
              data-id="relationships-table"
            >
              <thead>
                <tr>
                  <th>Parent</th>
                  <th>Child</th>
                  <th>Status</th>
                  <th>Type</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                <template for:each={relationshipRows} for:item="relationship">
                  <tr key={relationship.relationshipId}>
                    <td>{relationship.parentDisplay}</td>
                    <td>{relationship.childDisplay}</td>
                    <td>{relationship.statusLabel}</td>
                    <td>{relationship.relationshipType}</td>
                    <td class="oi-hierarchy-manager-row-actions">
                      <button
                        type="button"
                        class="oi-btn oi-btn_link"
                        data-id="deactivate-relationship-button"
                        data-relationship-id={relationship.relationshipId}
                        onclick={handleDeactivateRelationship}
                      >
                        Deactivate
                      </button>
                      <button
                        type="button"
                        class="oi-btn oi-btn_link"
                        data-id="view-history-button"
                        data-relationship-id={relationship.relationshipId}
                        data-child-object-api-name={relationship.childObjectApiName}
                        data-child-record-id={relationship.childRecordId}
                        onclick={handleViewHistoryClick}
                      >
                        History
                      </button>
                    </td>
                  </tr>
                  <template lwc:if={relationship.isHistoryOpenForThisRow}>
                    <tr key={relationship.historyRowKey}>
                      <td colspan="5">
                        <div
                          class="oi-hierarchy-manager-history"
                          data-id="history-panel"
                        >
                          <template lwc:if={isLoadingHistory}>
                            <c-oi-skeleton
                              data-id="history-loading"
                              lines="3"
                              label="Loading parent-change history"
                            ></c-oi-skeleton>
                          </template>
                          <template lwc:elseif={hasHistoryError}>
                            <c-oi-state-banner
                              data-id="history-error"
                              state="error"
                              title="Couldn't load parent-change history"
                              message={historyError}
                              onretry={handleRetryHistory}
                            ></c-oi-state-banner>
                          </template>
                          <template lwc:elseif={hasHistoryRows}>
                            <ul
                              class="oi-hierarchy-manager-history-list"
                              data-id="history-list"
                            >
                              <template for:each={historyRows} for:item="entry">
                                <li key={entry.historyId}>
                                  <strong>{entry.changeType}</strong> —
                                  {entry.previousParentLabel} to
                                  {entry.newParentLabel} ({entry.changedByName},
                                  {entry.changedDate})
                                </li>
                              </template>
                            </ul>
                          </template>
                          <template lwc:else>
                            <c-oi-state-banner
                              data-id="history-empty"
                              state="true-zero"
                              title="No parent changes recorded"
                              message="The history for this record loaded successfully and it has never been re-parented."
                            ></c-oi-state-banner>
                          </template>
                        </div>
                      </td>
                    </tr>
                  </template>
                </template>
              </tbody>
            </table>
          </template>
          <template lwc:else>
            <c-oi-state-banner
              data-id="relationships-empty"
              state="true-zero"
              title="No relationships defined yet"
              message="This hierarchy's relationships loaded successfully and there are none. Assign one to place a record in the hierarchy."
            ></c-oi-state-banner>
          </template>

          <template lwc:if={relationshipDraft}>
            <div class="oi-hierarchy-manager-form" data-id="relationship-form">
              <template lwc:if={hasRelationshipFormError}>
                <c-oi-state-banner
                  data-id="relationship-form-error"
                  state="error"
                  title="Couldn't save this relationship"
                  message={relationshipFormError}
                  onretry={handleSaveRelationship}
                ></c-oi-state-banner>
              </template>

              <div class="oi-hierarchy-manager-picker-field">
                <span class="oi-hierarchy-manager-picker-label"
                  >Child Record (required)</span
                >
                <template lwc:if={hasSelectedChild}>
                  <div
                    class="oi-hierarchy-manager-picker-selected"
                    data-id="selected-child"
                  >
                    <span>{relationshipDraft.childLabel}</span>
                    <button
                      type="button"
                      class="oi-btn oi-btn_link"
                      data-id="clear-child-button"
                      onclick={handleClearChild}
                    >
                      Change
                    </button>
                  </div>
                </template>
                <template lwc:else>
                  <c-oi-record-picker
                    data-id="child-record-picker"
                    object-api-name={definitionDraft.objectApiName}
                    placeholder-text="Search for the child record..."
                    onselect={handleChildSelect}
                  ></c-oi-record-picker>
                </template>
              </div>

              <div class="oi-hierarchy-manager-picker-field">
                <span class="oi-hierarchy-manager-picker-label"
                  >Parent Record (blank = root level)</span
                >
                <template lwc:if={hasSelectedParent}>
                  <div
                    class="oi-hierarchy-manager-picker-selected"
                    data-id="selected-parent"
                  >
                    <span>{relationshipDraft.parentLabel}</span>
                    <button
                      type="button"
                      class="oi-btn oi-btn_link"
                      data-id="clear-parent-button"
                      onclick={handleClearParent}
                    >
                      Change
                    </button>
                  </div>
                </template>
                <template lwc:else>
                  <c-oi-record-picker
                    data-id="parent-record-picker"
                    object-api-name={definitionDraft.objectApiName}
                    placeholder-text="Search for the parent record..."
                    onselect={handleParentSelect}
                  ></c-oi-record-picker>
                </template>
              </div>

              <lightning-combobox
                label="Hierarchy Level"
                data-field="hierarchyLevelId"
                data-id="relationship-level-select"
                value={relationshipDraft.hierarchyLevelId}
                options={levelOptions}
                onchange={handleRelationshipFieldChange}
              ></lightning-combobox>
              <lightning-input
                label="Relationship Type"
                data-field="relationshipType"
                value={relationshipDraft.relationshipType}
                onchange={handleRelationshipFieldChange}
              ></lightning-input>
              <lightning-input
                type="date"
                label="Effective Start Date"
                data-field="effectiveStartDate"
                value={relationshipDraft.effectiveStartDate}
                onchange={handleRelationshipFieldChange}
              ></lightning-input>
              <lightning-input
                type="date"
                label="Effective End Date"
                data-field="effectiveEndDate"
                value={relationshipDraft.effectiveEndDate}
                onchange={handleRelationshipFieldChange}
              ></lightning-input>

              <div class="oi-hierarchy-manager-form-actions">
                <button
                  type="button"
                  class="oi-btn oi-btn_primary"
                  data-id="save-relationship-button"
                  disabled={isSavingRelationship}
                  onclick={handleSaveRelationship}
                >
                  Save Relationship
                </button>
                <button
                  type="button"
                  class="oi-btn"
                  data-id="cancel-relationship-button"
                  onclick={handleCancelRelationshipForm}
                >
                  Cancel
                </button>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>
  </div>
</template>

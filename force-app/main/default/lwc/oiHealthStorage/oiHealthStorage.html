<template>
  <div class="oi-health-storage">
    <template if:true={isLoading}>
      <c-oi-skeleton lines="3" label="Loading Storage"></c-oi-skeleton>
    </template>

    <template if:true={hasError}>
      <c-oi-state-banner
        state="error"
        title="Couldn't load Storage"
        message={loadError}
        onretry={handleRetry}
      ></c-oi-state-banner>
    </template>

    <template if:true={hasStorage}>
      <div class="oi-health-detail-header">
        <div class="oi-health-detail-header-title">
          <div class="oi-health-eyebrow">Storage</div>
          <h2>Live data and file storage limits for this org</h2>
        </div>
      </div>

      <template if:true={hasUnavailableMetrics}>
        <c-oi-state-banner
          state="not-obtainable"
          title="Some metrics aren't obtainable"
          message={unavailableMetricsMessage}
        ></c-oi-state-banner>
      </template>

      <div class="oi-health-detail-kpi-row">
        <template for:each={kpiTiles} for:item="tile">
          <c-oi-health-kpi-tile
            key={tile.key}
            label={tile.label}
            value={tile.value}
          ></c-oi-health-kpi-tile>
        </template>
      </div>
    </template>
  </div>
</template>

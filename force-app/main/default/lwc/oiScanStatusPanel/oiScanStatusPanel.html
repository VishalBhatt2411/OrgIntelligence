<template>
  <section class="oi-scan-command" aria-label="Metadata scan status">
    <div class="oi-scan-command-identity" aria-hidden="true">
      <span class="oi-scan-command-pulse"></span>
      <span class="oi-scan-command-glyph">⌁</span>
    </div>
    <div class="oi-scan-command-content">
      <template if:true={isInitialLoading}>
        <c-oi-skeleton
          data-id="status-loading"
          lines="2"
          label="Loading scan status"
        ></c-oi-skeleton>
      </template>
      <template if:false={isInitialLoading}>
        <div class="oi-scan-command-copy">
          <span class="oi-scan-command-eyebrow">Metadata scan</span>
          <p class="slds-text-heading_small oi-scan-command-status">
            <strong>{statusLabel}</strong>
          </p>
        </div>
        <template if:true={message}>
          <p class="oi-scan-command-message">{message}</p>
        </template>
        <div class="oi-scan-status-panel-actions">
          <template if:false={isRunning}>
            <lightning-button
              data-id="start-scan-button"
              variant="brand"
              label="Start Scan"
              onclick={handleStartScan}
              disabled={isLoading}
            ></lightning-button>
          </template>
          <template if:true={isRunning}>
            <lightning-button
              data-id="cancel-scan-button"
              variant="destructive"
              label="Cancel Scan"
              onclick={handleCancelScan}
              disabled={isLoading}
            ></lightning-button>
          </template>
          <template if:true={isLoading}>
            <span
              class="oi-scan-status-panel-busy"
              data-id="action-busy"
              role="status"
              >{busyLabel}</span
            >
          </template>
        </div>
      </template>
    </div>
  </section>
</template>

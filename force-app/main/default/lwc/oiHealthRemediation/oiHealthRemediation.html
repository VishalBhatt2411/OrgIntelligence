<template>
  <div class="oi-health-remediation">
    <template if:true={isLoading}>
      <c-oi-skeleton lines="8" label="Loading Remediation"></c-oi-skeleton>
    </template>

    <template if:true={hasError}>
      <c-oi-state-banner
        state="error"
        title="Couldn't load Remediation"
        message={loadError}
        onretry={handleRetry}
      ></c-oi-state-banner>
    </template>

    <template if:true={hasData}>
      <div class="oi-remediation-summary">
        <div class="oi-remediation-kpi-row">
          <template for:each={summaryTiles} for:item="tile">
            <c-oi-health-kpi-tile
              key={tile.label}
              label={tile.label}
              value={tile.value}
            ></c-oi-health-kpi-tile>
          </template>
        </div>
        <div class="oi-remediation-breakdowns">
          <div class="oi-remediation-breakdown">
            <h3>By severity</h3>
            <ul>
              <template for:each={severityBreakdown} for:item="item">
                <li key={item.label}>
                  <span>{item.label}</span><span class="num">{item.value}</span>
                </li>
              </template>
            </ul>
          </div>
          <div class="oi-remediation-breakdown">
            <h3>By status</h3>
            <ul>
              <template for:each={statusBreakdown} for:item="item">
                <li key={item.label}>
                  <span>{item.label}</span><span class="num">{item.value}</span>
                </li>
              </template>
            </ul>
          </div>
          <div class="oi-remediation-breakdown">
            <h3>By section</h3>
            <ul>
              <template for:each={sectionBreakdown} for:item="item">
                <li key={item.label}>
                  <span>{item.label}</span><span class="num">{item.value}</span>
                </li>
              </template>
            </ul>
          </div>
        </div>
      </div>

      <div class="oi-remediation-filters">
        <lightning-dual-listbox
          label="Section"
          source-label="Available"
          selected-label="Filtered"
          options={sectionOptions}
          value={sectionKeys}
          onchange={handleSectionFilterChange}
        ></lightning-dual-listbox>
        <lightning-dual-listbox
          label="Severity"
          source-label="Available"
          selected-label="Filtered"
          options={severityOptions}
          value={severityKeys}
          onchange={handleSeverityFilterChange}
        ></lightning-dual-listbox>
        <lightning-dual-listbox
          label="Status"
          source-label="Available"
          selected-label="Filtered"
          options={statusOptions}
          value={statuses}
          onchange={handleStatusFilterChange}
        ></lightning-dual-listbox>
        <lightning-record-picker
          label="Owner"
          object-api-name="User"
          onchange={handleOwnerFilterChange}
        ></lightning-record-picker>
        <lightning-input
          type="search"
          label="Search"
          value={searchText}
          onchange={handleSearchChange}
        ></lightning-input>
        <lightning-input
          type="checkbox"
          label="Risk acceptance expiring soon"
          checked={onlyExpiringRiskAcceptance}
          onchange={handleExpiringToggle}
        ></lightning-input>
        <lightning-input
          type="checkbox"
          label="Overdue only"
          checked={onlyOverdue}
          onchange={handleOverdueToggle}
        ></lightning-input>
        <button type="button" class="oi-btn" onclick={handleClearFilters}>
          Clear filters
        </button>
        <button
          type="button"
          class="oi-btn"
          onclick={handleExport}
          disabled={isExporting}
        >
          {exportButtonLabel}
        </button>
      </div>

      <template if:true={exportError}>
        <c-oi-state-banner
          state="error"
          title="Couldn't export the Remediation queue"
          message={exportError}
          data-id="export-error"
          onretry={handleExport}
        ></c-oi-state-banner>
      </template>

      <div class="oi-remediation-table-wrap">
        <table class="oi-remediation-table">
          <thead>
            <tr>
              <template for:each={sortableColumns} for:item="column">
                <th key={column.field} scope="col" aria-sort={column.ariaSort}>
                  <button
                    type="button"
                    class={column.headerClass}
                    data-field={column.field}
                    onclick={handleSortColumnClick}
                  >
                    {column.label}
                    <span class="oi-remediation-sort-indicator"
                      >{column.indicator}</span
                    >
                  </button>
                </th>
              </template>
            </tr>
          </thead>
          <tbody>
            <template for:each={rows} for:item="row">
              <tr
                key={row.id}
                class="oi-remediation-row"
                data-finding-id={row.id}
                onclick={handleRowSelect}
              >
                <td>
                  <c-oi-health-severity-badge
                    severity-key={row.severityKey}
                    label={row.severityKey}
                  ></c-oi-health-severity-badge>
                </td>
                <td>
                  <div class="oi-remediation-title">{row.title}</div>
                  <div class="oi-remediation-component">
                    {row.componentLabel}
                  </div>
                </td>
                <td>{row.status}</td>
                <td>{row.dueDateLabel}</td>
                <td>{row.lastDetectedLabel}</td>
                <td class="num">{row.score}</td>
              </tr>
            </template>
          </tbody>
        </table>
        <template if:false={hasRows}>
          <c-oi-state-banner
            data-id="queue-empty"
            state="true-zero"
            title="No findings match this filter"
            message="Every finding in the queue is excluded by the current filters. Clear them to see the full queue."
          ></c-oi-state-banner>
        </template>
      </div>

      <div class="oi-remediation-pagination">
        <span>{pageSummaryLabel}</span>
        <div class="oi-remediation-pagination-buttons">
          <button
            type="button"
            class="oi-btn"
            onclick={handlePrevPage}
            disabled={isFirstPage}
          >
            ← Previous
          </button>
          <button
            type="button"
            class="oi-btn"
            onclick={handleNextPage}
            disabled={isLastPage}
          >
            Next →
          </button>
        </div>
      </div>
    </template>

    <c-oi-health-finding-drawer
      if:true={hasSelectedFinding}
      finding={selectedFinding}
      onclose={handleDrawerClose}
      onsaved={handleDrawerSaved}
      onrelatedselect={handleDrawerRelatedSelect}
    ></c-oi-health-finding-drawer>
  </div>
</template>

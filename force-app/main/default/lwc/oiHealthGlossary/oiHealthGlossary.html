<template>
  <template if:true={hasTerms}>
    <div class="oi-health-panel oi-health-glossary">
      <div class="oi-health-panel-head">
        <h3>{title}</h3>
      </div>
      <dl class="oi-health-glossary-list">
        <template for:each={displayTerms} for:item="entry">
          <div class="oi-health-glossary-entry" key={entry.key}>
            <dt>{entry.term}</dt>
            <dd>{entry.definition}</dd>
          </div>
        </template>
      </dl>
    </div>
  </template>
</template>

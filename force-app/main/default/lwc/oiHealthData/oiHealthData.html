<template>
  <div class="oi-health-data">
    <template if:true={isLoading}>
      <c-oi-skeleton lines="3" label="Loading Data Health"></c-oi-skeleton>
    </template>

    <template if:true={hasError}>
      <c-oi-state-banner
        state="error"
        title="Couldn't load Data Health"
        message={loadError}
        onretry={handleRetry}
      ></c-oi-state-banner>
    </template>

    <template if:true={showInProgressBanner}>
      <c-oi-state-banner
        state="not-yet-run"
        title="Data Health scan in progress"
        message={inProgressMessage}
      ></c-oi-state-banner>
    </template>

    <template if:true={isFailedRun}>
      <c-oi-state-banner
        state="error"
        title="The last Data Health scan failed"
        message="Run the scan again to get a fresh result."
        onretry={handleRecompute}
      ></c-oi-state-banner>
    </template>

    <template if:true={showNotYetRunPrompt}>
      <c-oi-state-banner
        state="not-yet-run"
        title="Data Health has not been computed yet"
        message="Run a scan to see stale, incomplete, and duplicate record signals across the scoped objects."
      ></c-oi-state-banner>
      <template if:true={canRunCompute}>
        <button
          type="button"
          class="oi-btn oi-btn_primary"
          onclick={handleRecompute}
          disabled={isRecomputeDisabled}
        >
          {recomputeButtonLabel}
        </button>
      </template>
    </template>

    <template if:true={hasResult}>
      <div class="oi-health-detail-header">
        <c-oi-health-score-ring
          score={detail.score}
          severity-key={detail.severityKey}
          size="lg"
        ></c-oi-health-score-ring>
        <div class="oi-health-detail-header-title">
          <div class="oi-health-eyebrow">Data Health</div>
          <h2>
            Stale, incomplete, and duplicate records across scoped objects
          </h2>
        </div>
        <div class="oi-health-detail-coverage">
          <span class="oi-health-coverage-pill">{detail.coverageNote}</span>
          <span>{computedAtLabel}</span>
          <template if:true={canRunCompute}>
            <button
              type="button"
              class="oi-btn"
              onclick={handleRecompute}
              disabled={isRecomputeDisabled}
            >
              {recomputeButtonLabel}
            </button>
          </template>
        </div>
      </div>

      <c-oi-health-formula-disclosure
        summary={detail.formulaSummary}
        components={formulaComponents}
        is-open-by-default="true"
      ></c-oi-health-formula-disclosure>

      <div class="oi-health-detail-kpi-row">
        <template for:each={detail.kpiTiles} for:item="tile">
          <c-oi-health-kpi-tile
            key={tile.label}
            label={tile.label}
            value={tile.value}
          ></c-oi-health-kpi-tile>
        </template>
      </div>

      <div class="oi-health-detail-split">
        <c-oi-health-breakdown-list
          title={detail.breakdownTitle}
          coverage-caption={detail.breakdownCoverageCaption}
          metric-column-labels={detail.metricColumnLabels}
          rows={breakdownRows}
          clickable
          onrowselect={handleRowSelect}
        ></c-oi-health-breakdown-list>
        <c-oi-health-heatmap-grid
          title="Signal heatmap"
          column-labels={detail.heatmapColumnLabels}
          rows={heatmapRows}
        ></c-oi-health-heatmap-grid>
      </div>

      <template if:true={selectionNote}>
        <p class="oi-health-selection-note" role="status">{selectionNote}</p>
      </template>
    </template>

    <c-oi-health-finding-drawer
      if:true={hasSelectedFinding}
      finding={selectedFinding}
      onclose={handleDrawerClose}
      onsaved={handleDrawerSaved}
      onrelatedselect={handleDrawerRelatedSelect}
    ></c-oi-health-finding-drawer>
  </div>
</template>

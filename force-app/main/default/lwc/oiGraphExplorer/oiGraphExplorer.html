<template>
  <div class="oi-graph-explorer">
    <div class="oi-graph-explorer-header">
      <div class="oi-analysis-launchpad-heading">
        <div>
          <span class="oi-analysis-launchpad-eyebrow">Analysis workspace</span>
          <strong>Choose a lens, then anchor the graph</strong>
        </div>
        <div class="oi-analyze-mode-group" role="tablist" aria-label="Analyze">
          <button
            type="button"
            data-id="analyze-mode-object"
            data-mode="Object"
            class={objectModeButtonClass}
            role="tab"
            aria-selected={isObjectMode}
            onclick={handleAnalyzeModeChange}
          >
            Object
          </button>
          <button
            type="button"
            data-id="analyze-mode-field"
            data-mode="Field"
            class={fieldModeButtonClass}
            role="tab"
            aria-selected={isFieldMode}
            onclick={handleAnalyzeModeChange}
          >
            Field
          </button>
          <button
            type="button"
            data-id="analyze-mode-record"
            data-mode="Record"
            class={recordModeButtonClass}
            role="tab"
            aria-selected={isRecordMode}
            onclick={handleAnalyzeModeChange}
          >
            Record
          </button>
        </div>
      </div>
      <template lwc:if={isFieldMode}>
        <template lwc:if={hasFieldModeObject}>
          <div class="oi-field-mode-picker">
            <div
              class="oi-context-ribbon oi-field-mode-object-banner"
              data-id="field-mode-object-banner"
            >
              <span class="oi-context-ribbon-step">1</span>
              <span class="oi-context-ribbon-copy">
                <small>Object selected</small>
                <strong>{fieldModeObjectLabel}</strong>
              </span>
              <button
                type="button"
                class="oi-field-mode-change-object"
                data-id="field-mode-change-object"
                onclick={handleChangeFieldModeObject}
              >
                Change object
              </button>
            </div>
            <template lwc:if={isLoadingFieldOptions}>
              <c-oi-skeleton lines="1" label="Loading fields"></c-oi-skeleton>
            </template>
            <template lwc:elseif={hasFieldModeOptions}>
              <c-oi-field-picker
                data-id="field-mode-field-picker"
                options={fieldModeFieldOptions}
                onchange={handleFieldPicked}
              ></c-oi-field-picker>
            </template>
            <template lwc:else>
              <div
                class="oi-field-mode-no-fields"
                data-id="field-mode-no-fields"
              >
                This object has no scanned fields yet.
              </div>
            </template>
          </div>
        </template>
        <template lwc:else>
          <c-oi-search-bar
            placeholder-text={searchPlaceholder}
            type-key-filter={searchTypeKeyFilter}
            registry={registry}
            onselect={handleFieldModeObjectSelect}
          ></c-oi-search-bar>
        </template>
      </template>
      <template lwc:elseif={isRecordMode}>
        <template lwc:if={hasRecordModeObject}>
          <div class="oi-record-mode-picker">
            <div
              class="oi-context-ribbon oi-record-mode-object-banner"
              data-id="record-mode-object-banner"
            >
              <span class="oi-context-ribbon-step">1</span>
              <span class="oi-context-ribbon-copy">
                <small>Searching records in</small>
                <strong>{recordModeObjectLabel}</strong>
              </span>
              <button
                type="button"
                class="oi-record-mode-change-object"
                data-id="record-mode-change-object"
                onclick={handleChangeRecordModeObject}
              >
                Change object
              </button>
            </div>
            <c-oi-record-picker
              object-api-name={recordModeObjectApiName}
              placeholder-text={recordSearchPlaceholder}
              onselect={handleRecordPicked}
            ></c-oi-record-picker>
          </div>
        </template>
        <template lwc:elseif={isLoadingRecordModeObject}>
          <c-oi-skeleton lines="1" label="Loading object"></c-oi-skeleton>
        </template>
        <template lwc:else>
          <c-oi-search-bar
            placeholder-text="First, search for the object this record belongs to (e.g. Account)..."
            type-key-filter={searchTypeKeyFilter}
            registry={registry}
            onselect={handleRecordModeObjectSelect}
          ></c-oi-search-bar>
        </template>
      </template>
      <template lwc:else>
        <template lwc:if={shouldShowObjectSearchBar}>
          <c-oi-search-bar
            placeholder-text={searchPlaceholder}
            type-key-filter={searchTypeKeyFilter}
            registry={registry}
            onselect={handleSearchSelect}
          ></c-oi-search-bar>
        </template>
        <template lwc:elseif={centerObjectSummary}>
          <div
            class="oi-context-ribbon oi-object-mode-banner"
            data-id="object-mode-banner"
          >
            <span class="oi-context-ribbon-step">✓</span>
            <span class="oi-context-ribbon-copy">
              <small>Graph anchored on</small>
              <strong>{centerObjectSummary.label}</strong>
            </span>
            <button
              type="button"
              class="oi-object-mode-change"
              data-id="object-mode-change-object"
              onclick={handleChangeObjectSearch}
            >
              Change object
            </button>
          </div>
        </template>
      </template>
    </div>

    <template lwc:if={hasError}>
      <c-oi-state-banner
        data-id="explorer-error"
        state="error"
        title="Couldn't load that part of the graph"
        message={errorMessage}
        onretry={handleErrorRetry}
      ></c-oi-state-banner>
    </template>

    <template lwc:if={workingSetCeilingHit}>
      <div class="oi-graph-explorer-ceiling-banner" data-id="ceiling-banner">
        Your graph has gotten large — collapse a branch you're done exploring to
        continue.
      </div>
    </template>

    <div class="oi-graph-explorer-body">
      <div class="oi-graph-explorer-canvas-column">
        <template lwc:if={isLoadingFragment}>
          <div class="oi-graph-explorer-loading" data-id="explorer-loading">
            <c-oi-skeleton lines="6" label="Loading graph"></c-oi-skeleton>
          </div>
        </template>
        <template lwc:if={hasCenterNode}>
          <template lwc:if={usesRelationshipCanvas}>
            <c-oi-relationship-canvas
              mode={analyzeMode}
              center-node-key={viewState.centerNodeKey}
              nodes={allCanvasNodes}
              edges={allCanvasEdges}
              onselect={handleCanvasSelect}
              onexplorefromhere={handleExploreFromHere}
              onedgeclick={handleObjectCanvasEdgeClick}
              onopen={handleCanvasOpen}
            ></c-oi-relationship-canvas>
          </template>
          <template lwc:else>
            <c-oi-graph-canvas
              center-node-key={viewState.centerNodeKey}
              nodes={canvasNodes}
              edges={canvasEdges}
              selected-node-key={selectedNodeKey}
              onselect={handleCanvasSelect}
              onopen={handleCanvasOpen}
              onexpand={handleExpand}
              oncollapse={handleCollapse}
            ></c-oi-graph-canvas>
            <template lwc:if={hasFilterPanel}>
              <c-oi-filter-panel
                data-id="filter-panel"
                edge-type-options={edgeTypeFilterOptions}
                direction={relationshipDirection}
                restrict-to-direct-only={restrictToDirectOnly}
                onedgetypetoggle={handleEdgeTypeToggle}
                ondirectiontoggle={handleDirectionToggle}
                ondepthtoggle={handleDepthToggle}
              ></c-oi-filter-panel>
            </template>
          </template>
        </template>
        <template lwc:else>
          <div
            class="oi-graph-explorer-placeholder"
            data-id="explorer-placeholder"
          >
            <div class="oi-placeholder-orbit" aria-hidden="true">
              <span></span><span></span><span></span><b></b>
            </div>
            <span class="oi-placeholder-eyebrow">Ready to map</span>
            <strong>Start with a Salesforce entity</strong>
            <p>
              Search above to reveal relationships, dependencies and impact in
              one connected view.
            </p>
          </div>
        </template>
      </div>
      <div class="oi-graph-explorer-detail-column">
        <c-oi-node-detail-panel
          node-key={selectedNodeKey}
          registry={registry}
          object-relationship-summary={objectRelationshipSummary}
          onselect={handleDetailPanelSelect}
          onhighlightimpact={handleHighlightImpact}
        ></c-oi-node-detail-panel>
      </div>
    </div>

    <template lwc:if={selectedConnector}>
      <c-oi-relationship-connector-detail
        connector={selectedConnector}
        root-object={selectedConnectorRootObject}
        mode={analyzeMode}
        onclose={handleConnectorDetailClose}
      ></c-oi-relationship-connector-detail>
    </template>
  </div>
</template>
